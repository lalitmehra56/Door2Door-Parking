# Application
spring.application.name=park-space-rental

# Server
server.port=8080

# H2 Database (Development)
spring.datasource.url=jdbc:h2:mem:parkspacedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT
app.jwt.secret=parkSpaceRentalSecretKey2024VeryLongSecretKeyForJWTTokenGeneration
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# HTTP Request Size (for base64 images)
server.max-http-header-size=10MB
spring.servlet.multipart.enabled=true
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-post-size=10MB
